# 内容港 Harbor — AI 多平台内容发布中台
# 包管理与启动推荐使用 uv（https://github.com/astral-sh/uv）

[project]
name = "harbor-backend"
version = "0.14.2"
description = "Harbor 后端：基于 FastAPI 的文章库 / 多平台发布 / AIGC 合规门禁"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "click>=8.1.0",
    "PyJWT>=2.8.0",
    # 直接 import bcrypt / cryptography：必须显式声明，不能靠 passlib[bcrypt] 的传递依赖
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    # 平台发布引擎依赖
    "patchright>=1.60",
    "requests>=2.31",
    "markdown>=3.5",
    "mcp>=1.0,<2",
    "croniter>=2.0",
    "prometheus-client>=0.20",
    "pyahocorasick>=2.1",
    "rapidfuzz>=3.9",
    "tenacity>=8.2",
    "jieba>=0.42",
    "python-frontmatter>=1.1",
    "trafilatura>=1.12",
    "pillow>=10.3",
    "markdown-it-py>=3.0",
    "telegraph>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv]
# 应用型脚手架（非可发布库）：不打包安装项目本身，用 uv run 在环境中执行
package = false
# 默认同步时安装 dev 依赖组，便于测试
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Pydantic 弃用一律当错误：`.dict()` 在 v2 已弃用、v3 移除，而依赖写的是
# `pydantic>=2.0.0`（允许装 v3）。让它在测试里红掉，比等升级炸在运行时强。
filterwarnings = [
    "error::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
# 回归门禁只查"真会出错"的规则：
#   F82 未定义名 / 未绑定名   —— scheduler.py 的 row F821、service.py 的
#                             wait_human_captcha 误删，都是这么漏上线的
#   F7  assert/return/Continue 位置错、except 位置错等运行时错误
#   E9  语法错误
#
# 已清理但**故意不纳入门禁**的：
#   E402 导入位置 9 处 —— 全是有意为之：config/__init__.py 先定义 __all__ 再
#        re-export；service.py 的跨模块 import 必须排在 ROOT 与哈希函数之后
#        （:37 的"导入即注册"尤其不能动）。上移会破坏依赖顺序，属可读性提示
#        而非 bug，改它只有坏处。
#   E702 分号多语句 —— 已清零，但 ruff 不自动改（涉及语句拆分）。cnblogs_login
#        的浏览器操作序列已人工拆行，保持顺序逐字不变。
#
# F401/F541/E401/F811/F841 已于 0.6.4 一次性清零并纳入 —— 那批里有真 bug
# （ruff --fix 误删唯一引入点），不是纯风格债。
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 卫生规则一并纳入（0.6.4 已清零并验证）：F401/F541/E401/E702/F811/F841
# 这批里藏着真 bug，不是纯风格债。E402 故意排除，理由见上方注释。
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",   # 有意为之的后置 import，见上方注释
]

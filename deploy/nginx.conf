limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    # HSTS 只在 HTTPS 下下发：这个 nginx 默认监听 80，无条件发 HSTS 会让
    # 浏览器记住"一年内只能走 HTTPS"，把纯 HTTP 部署直接锁死。
    # 前面有 TLS 终止时用 $http_x_forwarded_proto 判断。
    set $hsts "";
    if ($http_x_forwarded_proto = "https") {
        set $hsts "max-age=31536000; includeSubDomains";
    }
    add_header Strict-Transport-Security $hsts always;

    server_tokens off;
    # 必须 >= 后端 media.MAX_BYTES(15MB)：此前写 10M，用户传 12MB 图会先被
    # nginx 413 拦掉，而错误页与后端 JSON 提示不一致，用户完全不知道上限。
    client_max_body_size 16M;

    # 网关不代客户端注入共享令牌：只透传调用方自带的 X-API-Token。
    # 部署时必须在本层之外再加访问控制（反向代理鉴权 / VPN / 仅内网）。
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Token $http_x_api_token;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-API-Token $http_x_api_token;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        # nginx 的 add_header 不继承：只要本级出现 add_header，上层的安全头
        # 全部失效。这里必须把关键几条补回来，否则静态资源裸奔。
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

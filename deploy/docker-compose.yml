# 内容港 Harbour — Docker Compose
#
# 一键启动（后端 + 前端 + nginx）：
#   docker compose --profile web up -d --build
#
# 仅启动后端：
#   docker compose up -d --build backend
#
# 后端默认使用 SQLite（零依赖），数据存储在命名卷 hub_data 中。

name: ai-content-hub

networks:
  app-net:
    driver: bridge

volumes:
  hub_data:

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ach-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-docker}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production-min-32-chars}
      # 数据根：DB / 媒体 / 登录快照 / 事件日志全部挂在 data_root() 下。
      # 不设它时数据落在镜像内 backed/service/data，容器重建即丢（原 compose
      # 挂载的是 backed/data，而代码实际用的是 backed/service/data，两边对不上）。
      HUB_DATA_DIR: /app/data
    volumes:
      - hub_data:/app/data
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    profiles: ["web"]
    build:
      # 上下文必须含 Dockerfile 本身：用仓库根 + deploy/ 下的路径（旧写法
      # context ../web + dockerfile deploy/*.web 让目标文件落在上下文之外，
      # 传统 builder 直接拒绝构建）
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: ach-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend
    networks: [app-net]
